<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sầu Riêng Thu Mến</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 20px; }
        .box { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 10px; shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2d5a27; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #2d5a27; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 95%; }
    </style>
</head>
<body>

<div class="box">
    <h1>Sầu Riêng Thu Mến 🌳</h1>
    <p>Vui lòng nhập thông tin đặt hàng</p>
    
    <input type="text" id="name" placeholder="Họ và tên">
    <input type="tel" id="phone" placeholder="Số điện thoại">
    <select id="type">
        <option value="pickup">Tự đến lấy</option>
        <option value="ship">Giao hàng (Ship)</option>
    </select>
    <button onclick="order()">ĐẶT HÀNG NGAY</button>
</div>

<script>
    function order() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('phone').value;
        if(n == "" || p == "") {
            alert("Bạn điền thiếu thông tin rồi!");
        } else {
            alert("Cảm ơn " + n + "! Đơn hàng đã được gửi.");
            // Chỗ này bạn nhớ thay mã Telegram vào như mình hướng dẫn trước đó nhé
        }
    }
</script>

</body>
</html>
